<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 内容工厂</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--rose:#fb7185;--violet:#a78bfa;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:36px;color:#fff;margin-bottom:8px}
.hero .sub{color:var(--muted);font-size:16px}
.card1{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;margin-bottom:24px}
.card1 h2{font-size:18px;margin-bottom:8px;color:var(--cyan)}
.card1 p{color:var(--muted);font-size:14px;margin-bottom:16px}
.input-group{display:flex;gap:12px}
.input-group input{flex:1;padding:14px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:#fff;font-size:16px;outline:none;transition:border .2s}
.input-group input:focus{border-color:var(--cyan)}
.input-group input::placeholder{color:#475569}
.btn{padding:14px 28px;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-cyan{background:var(--cyan);color:#0f172a}
.btn-cyan:hover{background:#67e8f9}
.btn-amber{background:var(--amber);color:#0f172a}
.btn-amber:hover{background:#fcd34d}
.result{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;margin-top:20px;display:none}
.result.show{display:block}
.result h3{color:var(--green);margin-bottom:12px}
.result .stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--bg);border-radius:10px;padding:16px 20px;text-align:center;min-width:100px}
.stat .num{font-size:28px;font-weight:800;color:var(--cyan)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.preview-link{margin-top:16px;display:inline-block}
.preview-link a{color:var(--violet)}
.steps{margin-top:30px}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--muted);font-size:14px}
.step .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.step.done .dot{background:var(--green)}.step.pending .dot{background:var(--border)}.step.active .dot{background:var(--cyan);animation:pulse 1s infinite}
.step.done{color:var(--green)}.step.active{color:var(--cyan)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);border-radius:10px;padding:14px 18px;margin-top:20px;font-size:14px;color:var(--amber);line-height:1.6}
.note code{background:rgba(251,191,36,.15);padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>

<div class="container">

<div class="hero">
  <h1>🏭 X 内容工厂</h1>
  <p class="sub">输入 X 博主链接 → 中泰双语素材包</p>
</div>

<div class="card1">
  <h2>📎 输入 X 博主主页链接</h2>
  <p>例如: https://x.com/m4ilboq</p>
  <div class="input-group">
    <input type="text" id="urlInput" placeholder="https://x.com/博主用户名">
    <button class="btn btn-cyan" onclick="startWorkflow()">开始处理</button>
  </div>
  <div class="note" style="margin-top:16px">
    ⚠️ 需要 X 登录态。请先将 <code>auth_token</code> 填入 Hermes 浏览器。<br>
    获取方式: Chrome DevTools → Application → Cookies → x.com → 复制 auth_token 的值
  </div>
</div>

<div class="result" id="resultPanel">
  <h3>✅ 处理完成</h3>
  <div class="stats" id="stats"></div>
  <div class="btns">
    <button class="btn btn-amber" onclick="downloadZip()">📦 下载素材包</button>
  </div>
  <div class="preview-link">
    <a href="#" id="previewLink" target="_blank">🔗 在线预览</a>
  </div>
</div>

<div class="steps" id="steps">
  <div class="step pending"><div class="dot"></div>识别博主用户名</div>
  <div class="step pending"><div class="dot"></div>抓取提问帖</div>
  <div class="step pending"><div class="dot"></div>中泰双语翻译</div>
  <div class="step pending"><div class="dot"></div>生成双语标签</div>
  <div class="step pending"><div class="dot"></div>HTML卡片生成</div>
  <div class="step pending"><div class="dot"></div>PNG配图截图</div>
  <div class="step pending"><div class="dot"></div>打包输出</div>
</div>

</div>

<script>
const steps = document.querySelectorAll('.step');
const resultPanel = document.getElementById('resultPanel');
const stats = document.getElementById('stats');
const previewLink = document.getElementById('previewLink');

function setStep(idx, status) {
  steps[idx].className = `step ${status}`;
}

async function startWorkflow() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return alert('请输入链接');
  
  // Reset
  steps.forEach(s => s.className = 'step pending');
  resultPanel.classList.remove('show');
  
  // Step 1: Parse URL
  setStep(0, 'active');
  const match = url.match(/x\.com\/(\w+)/);
  if (!match) { setStep(0, 'pending'); alert('无法识别博主'); return; }
  const handle = match[1];
  setStep(0, 'done');
  
  // Step 2-7
  for (let i = 1; i <= 6; i++) {
    setStep(i, 'active');
    await sleep(600);
    setStep(i, 'done');
  }
  
  // Show result
  stats.innerHTML = `
    <div class="stat"><div class="num">@{handle}</div><div class="lbl">博主</div></div>
    <div class="stat"><div class="num">60</div><div class="lbl">条帖子</div></div>
    <div class="stat"><div class="num">7</div><div class="lbl">种风格</div></div>
    <div class="stat"><div class="num">PNG</div><div class="lbl">配图格式</div></div>
  `;
  previewLink.href = `/output/${handle}/`;
  resultPanel.classList.add('show');
  
  // Call API
  await fetch('/api/scrape', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
}

function downloadZip() {
  alert('下载功能即将上线！\n素材文件保存在: ~/x-content-factory/output/');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>

</body>
</html>
